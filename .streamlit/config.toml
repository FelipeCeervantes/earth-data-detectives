# Identidad "Ventana al cielo" (ver docs/marca.md). Sin logos ni colores de la NASA.
# Los mismos valores viven en src/estilo.py; si cambias uno, cambia el otro.
[theme]
base = "dark"
primaryColor = "#5CC8FF"               # agua: controles y foco
backgroundColor = "#0B2B52"            # cielo hondo (el degradado y el relieve 3D los pone src/estilo.py)
secondaryBackgroundColor = "#163E6B"   # campos
textColor = "#F3F8FD"                  # nube
linkColor = "#5CC8FF"
borderColor = "#2E5C8C"
showWidgetBorder = true
baseRadius = "1rem"
font = "Figtree:https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
headingFont = "Outfit:https://fonts.googleapis.com/css2?family=Outfit:wght@200..800&display=swap"
headingFontWeights = 600
metricValueFontSize = "2.1rem"

[client]
toolbarMode = "viewer"   # sin el botón "Deploy" ni menús de desarrollador

[server]
headless = true

[browser]
gatherUsageStats = false
